<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register as a Doctor on Convofy — AI-powered healthcare telemedicine platform.">
    <title>Convofy — Doctor Registration</title>
    <link rel="icon" href="./static/images/heart-pulse-solid.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./static/css/style.css">
    <style>
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .auth-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
            padding: 4rem; width: 100%; max-width: 52rem;
            box-shadow: 0 24px 64px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .auth-card .logo { display: block; text-align: center; font-size: 2.8rem; font-weight: 800; margin-bottom: 0.5rem; }
        .auth-card .auth-subtitle { text-align: center; color: var(--light-color); font-size: 1.5rem; margin-bottom: 3rem; text-transform: none; }
        .field-label { color: var(--light-color); font-size: 1.3rem; display: block; margin-bottom: 0.3rem; margin-top: 1.2rem; text-transform: none; }
        .auth-input {
            width: 100%; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
            font-size: 1.5rem; color: #fff; text-transform: none; padding: 1.2rem 1.5rem;
            background: rgba(255,255,255,0.04); display: block; font-family: 'Poppins', sans-serif;
        }
        .auth-input:focus { border-color: var(--green); background: rgba(0,201,167,0.04); outline: none; }
        .auth-input::placeholder { color: rgba(255,255,255,0.35); }
        .auth-btn {
            width: 100%; margin-top: 2rem; padding: 1.3rem; background: var(--green);
            color: #fff; border-radius: 10px; font-size: 1.6rem; font-weight: 700;
            cursor: pointer; border: 2px solid var(--green); text-transform: uppercase;
            letter-spacing: 0.08em; font-family: 'Poppins', sans-serif; transition: all 0.3s ease;
        }
        .auth-btn:hover { background: transparent; color: var(--green); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,201,167,0.3); }
        .auth-switch { color: rgba(255,255,255,0.6); font-size: 1.4rem; margin-top: 2rem; text-align: center; text-transform: none; }
        .auth-switch a { color: var(--green); font-size: 1.5rem; font-weight: 600; }
        .doctor-badge {
            display: flex; align-items: center; gap: 1rem; background: rgba(0,201,167,0.08);
            border: 1px solid rgba(0,201,167,0.2); border-radius: 10px; padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
        }
        .doctor-badge i { color: var(--green); font-size: 2rem; }
        .doctor-badge p { color: var(--light-color); font-size: 1.3rem; text-transform: none; }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <a href="{{url_for('index')}}" class="logo"><i class="fas fa-heartbeat"></i> Convofy</a>
            <p class="auth-subtitle">Doctor Registration Portal</p>

            <div class="doctor-badge">
                <i class="fas fa-user-md"></i>
                <p>Register as a verified medical professional to start managing patient appointments on Convofy.</p>
            </div>

            <form method="post" action="{{ url_for('doctor_register') }}">
                <label class="field-label" for="username">Username</label>
                <input class="auth-input" type="text" id="username" name="username" placeholder="Enter your username" required>

                <label class="field-label" for="password">Password</label>
                <input class="auth-input" type="password" id="password" name="password" placeholder="Create a strong password" required>

                <label class="field-label" for="email">Email Address</label>
                <input class="auth-input" type="email" id="email" name="email" placeholder="Enter your email" required>

                <label class="field-label" for="type_of_doctor">Medical Specialty</label>
                <input class="auth-input" type="text" id="type_of_doctor" name="type_of_doctor" placeholder="E.g. Cardiologist, Pediatrician..." required>

                <button type="submit" class="auth-btn">Register as Doctor</button>

                <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign In Here</a></p>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-bottom" style="border-top: 1px solid rgba(255,255,255,0.06); padding-top: 2rem;">
            <p>&copy; 2024 Convofy. All rights reserved.</p>
            <div class="footer-links">
                <a href="{{url_for('policy')}}">Privacy Policy</a>
                <a href="{{url_for('policy')}}">Terms of Service</a>
            </div>
        </div>
    </footer>
</body>
</html>
